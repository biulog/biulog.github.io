<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="下載 BiuLog 寶寶作息紀錄 App，支援 iPhone 與 Android。">
  <meta name="theme-color" content="#fbf7f1">
  <meta property="og:title" content="下載 BiuLog">
  <meta property="og:description" content="一個連結，依照你的手機自動前往 App Store 或 Google Play。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://biulog.github.io/download/">
  <meta property="og:image" content="https://biulog.github.io/assets/biulog-icon.png">
  <link rel="icon" href="/assets/biulog-icon.png">
  <title>下載 BiuLog｜iOS・Android</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fbf7f1;
      --surface: rgba(255, 253, 250, .92);
      --ink: #554c42;
      --muted: #8c7f73;
      --line: rgba(152, 121, 90, .17);
      --gold: #d6af75;
      --gold-deep: #8b6d51;
      --shadow: 0 24px 72px rgba(84, 73, 62, .15);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Noto Sans", sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(233, 175, 189, .25), transparent 34%),
        radial-gradient(circle at 88% 86%, rgba(202, 217, 232, .34), transparent 36%),
        linear-gradient(145deg, #fff9f3 0%, #fbf7f1 54%, #f7f1eb 100%);
    }

    main {
      width: min(100%, 520px);
      padding: 34px 26px 28px;
      text-align: center;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, .92);
      border-radius: 32px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .app-icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      border-radius: 25px;
      box-shadow: 0 12px 34px rgba(84, 73, 62, .17);
    }

    h1 {
      margin: 0;
      font-size: clamp(29px, 7vw, 40px);
      line-height: 1.2;
      letter-spacing: -.02em;
    }

    .lead {
      margin: 12px auto 24px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 30px;
      margin-bottom: 20px;
      color: var(--gold-deep);
      font-size: 14px;
      font-weight: 700;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(214, 175, 117, .32);
      border-top-color: var(--gold-deep);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .store-links {
      display: grid;
      gap: 12px;
    }

    .store-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 68px;
      padding: 13px 18px;
      color: var(--ink);
      text-decoration: none;
      background: rgba(255, 255, 255, .78);
      border: 1px solid var(--line);
      border-radius: 20px;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .store-link:hover,
    .store-link:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(152, 121, 90, .4);
      box-shadow: 0 10px 28px rgba(84, 73, 62, .11);
      outline: none;
    }

    .store-copy {
      display: grid;
      gap: 2px;
      text-align: left;
    }

    .store-copy small {
      color: var(--muted);
      font-size: 12px;
    }

    .store-copy strong {
      font-size: 17px;
    }

    .arrow {
      color: var(--gold-deep);
      font-size: 25px;
      line-height: 1;
    }

    .hint {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .home-link {
      display: inline-block;
      margin-top: 14px;
      color: var(--gold-deep);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 420px) {
      main {
        padding: 28px 18px 24px;
        border-radius: 26px;
      }

      .app-icon {
        width: 84px;
        height: 84px;
        border-radius: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
      }

      .store-link {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <img class="app-icon" src="/assets/biulog-icon.png" alt="BiuLog App 圖示" width="96" height="96">
    <h1>下載 BiuLog</h1>
    <p class="lead">寶寶作息、家庭共享與托育照護，一個 App 溫柔整理。</p>

    <div class="status" id="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>正在為你開啟適合的商店…</span>
    </div>

    <div class="store-links" aria-label="選擇 App 商店">
      <a class="store-link" id="ios-link" href="https://apps.apple.com/tw/app/biulog/id6766629143">
        <span class="store-copy">
          <small>iPhone・iPad</small>
          <strong>前往 App Store</strong>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="store-link" id="android-link" href="https://play.google.com/store/apps/details?id=com.chy.biulog">
        <span class="store-copy">
          <small>Android</small>
          <strong>前往 Google Play</strong>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </div>

    <p class="hint">如果商店沒有自動開啟，請直接點選上方對應按鈕。</p>
    <a class="home-link" href="/">查看 BiuLog 官網</a>
  </main>

  <noscript>
    <style>.status { display: none; }</style>
  </noscript>

  <script>
    (() => {
      const IOS_URL = "https://apps.apple.com/tw/app/biulog/id6766629143";
      const ANDROID_URL = "https://play.google.com/store/apps/details?id=com.chy.biulog";
      const params = new URLSearchParams(window.location.search);
      const preview = params.get("preview") === "1";
      const ua = navigator.userAgent || "";
      const platform = navigator.platform || "";
      const isIPadOS = platform === "MacIntel" && navigator.maxTouchPoints > 1;
      const isIOS = /iPhone|iPad|iPod/i.test(ua) || isIPadOS;
      const isAndroid = /Android/i.test(ua);
      const status = document.getElementById("status");

      let target = null;
      let storeName = "";

      if (isIOS) {
        target = IOS_URL;
        storeName = "App Store";
      } else if (isAndroid) {
        target = ANDROID_URL;
        storeName = "Google Play";
      }

      if (target && !preview) {
        status.querySelector("span:last-child").textContent = `正在開啟 ${storeName}…`;
        window.setTimeout(() => window.location.replace(target), 320);
      } else {
        status.innerHTML = "<span>請選擇你的手機商店</span>";
      }
    })();
  </script>
</body>
</html>
